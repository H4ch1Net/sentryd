# sentryd built-in defaults. Do not edit this file — copy config/signatures.yaml
# in the repo (or pass --config) to override any subset of these values.

engine:
  # Alerts with the same (rule, src, dst) within this many seconds of event
  # time are merged into one alert with an occurrence count.
  cooldown_seconds: 60

rules:
  port_scan:
    enabled: true
    window_seconds: 10
    min_distinct_targets: 15

  suspicious_port:
    enabled: true
    ports:
      - port: 23
        label: Telnet
        severity: medium
        note: Cleartext remote administration; rarely legitimate on modern networks.
      - port: 2323
        label: Telnet (alternate)
        severity: medium
        note: Common IoT botnet (Mirai) scan target.
      - port: 4444
        label: Metasploit default handler
        severity: high
        note: Default listener port for Metasploit reverse shells.
      - port: 5555
        label: Android Debug Bridge
        severity: high
        note: Exposed ADB allows unauthenticated device control.
      - port: 6667
        label: IRC
        severity: medium
        note: Classic botnet command-and-control channel.
      - port: 1337
        label: Elite / common backdoor
        severity: medium
        note: Frequently used by hobbyist backdoors and CTF implants.
      - port: 31337
        label: Back Orifice
        severity: high
        note: Historic backdoor port; still a common implant choice.
      - port: 9001
        label: Tor ORPort
        severity: low
        note: Tor relay traffic; may violate egress policy.
